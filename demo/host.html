<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<title>Demo-portaal</title>
<style>
  body { margin: 0; font-family: system-ui, sans-serif; background: #f2f3f5; }
  header { display: flex; gap: 12px; align-items: center; padding: 10px 16px; background: #1f3a5f; color: #fff; }
  header nav a { color: #cfe0ff; margin-right: 12px; }
  header button { margin-left: auto; }
  header .tag { font-size: 12px; opacity: .85; }
  main { padding: 16px; }
  iframe { width: 100%; height: 920px; border: 1px solid #ccd; background: #fff; }
</style>
</head>
<body>
  <header>
    <strong>Demo-portaal</strong>
    <span class="tag">Playground · scroll in de iframe naar Uitdagingen</span>
    <nav><a href="#">Start</a><a href="#">Mijn apps</a><a href="#">Help</a></nav>
    <button id="fs">Volledig scherm</button>
  </header>
  <main>
    <iframe id="app" src="{{APP_URL}}" title="Weerapp playground" allow="fullscreen"></iframe>
  </main>
<script>
  document.getElementById('fs').addEventListener('click', () => document.getElementById('app').requestFullscreen());
</script>
</body>
</html>
