<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<title>Sandbox zonder scripts</title>
<style>
  body { margin: 0; font-family: system-ui, sans-serif; background: #fff7f0; color: #123; padding: 8px 12px; font-size: 13px; }
  summary { cursor: pointer; display: inline-block; padding: 6px 12px; border-radius: 6px; background: #123; color: #fff; }
</style>
</head>
<body>
  <!-- sandbox="" blocks all scripts in this frame; only native controls work. -->
  <details id="ns"><summary>Zonder script</summary>Inhoud zonder script zichtbaar.</details>
  <label><input type="checkbox" id="nsCheck"> Vinkje zonder script</label>
</body>
</html>
